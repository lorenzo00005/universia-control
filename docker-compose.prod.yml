# Producción: un solo dominio, dos subdominios, HTTPS automático.
#   https://crm.tudominio.com   -> panel del CRM
#   https://waha.tudominio.com  -> dashboard de WAHA
# Uso:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requiere Docker Compose v2.24+ (por "!reset").
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
      WAHA_DOMAIN: ${WAHA_DOMAIN}
      WAHA_BASIC_USER: ${WAHA_BASIC_USER:-admin}
      WAHA_BASIC_HASH: ${WAHA_BASIC_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - waha

  # Nada más se publica al exterior: todo entra por Caddy.
  waha:
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      CORS_ORIGINS: https://${CRM_DOMAIN}
  frontend:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
