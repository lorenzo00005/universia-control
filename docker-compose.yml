name: rcm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  waha:
    image: devlikeapro/waha:latest   # fijar versión (ej. :2026.10.1) antes de producción
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS  # alternativas: WEBJS, NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      # Webhook global: toda sesión (creada en el CRM o en el dashboard de WAHA) avisa al backend
      WHATSAPP_HOOK_URL: http://backend:8000/webhooks/waha/${WEBHOOK_SECRET}
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,session.status
    volumes:
      - ./data/waha/sessions:/app/.sessions
      - ./data/waha/media:/app/.media
    ports:
      - "127.0.0.1:3000:3000"        # solo local; el backend entra por la red interna

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WAHA_URL: http://waha:3000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
